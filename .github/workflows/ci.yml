name: CI

# Runs on every push to any branch and on every pull request.
# To enforce this as a merge gate, go to:
#   GitHub → Settings → Branches → Branch protection rules → main
#   → "Require status checks to pass before merging" → select "Lint & Test"
#     and "E2E Smoke"

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # PAR-0: la guardia confronta il branch con origin/main

      # PAR-0 — corsia estetica: sui branch estetica/* fallisce se un file
      # cambiato e' fuori dall'elenco di docs/PARALLELO.md. Sugli altri branch
      # non fa nulla. Gira la versione di origin/main dello script, non quella
      # del branch: un branch non puo' allargarsi la corsia da solo.
      - name: Corsia estetica
        run: |
          git show origin/main:scripts/check-lane.mjs > "$RUNNER_TEMP/check-lane.mjs"
          node "$RUNNER_TEMP/check-lane.mjs"

      # actions/setup-node with cache: 'npm' automatically caches ~/.npm
      # using a key derived from package-lock.json.  On cache hit, npm ci
      # resolves in seconds instead of downloading from the registry.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # SICUREZZA-CHIAVI — nessuna chiave segreta (sk-ant-, sk-proj-, sk- lunghi, JWT service_role,
      # sk_live_, whsec_, ghp_/github_pat_) nei file tracciati. Stampa file e riga, mai il valore.
      - name: Chiavi segrete nei file tracciati
        run: node scripts/controlla-chiavi.mjs

      - name: Lint
        run: npm run lint

      # npm run test:run = "vitest run" (single-pass, non-interactive).
      # This is the correct CI invocation — "npm test" starts watch mode.
      - name: Run tests
        run: npm run test:run

      # SICUREZZA-CHIAVI — il sito costruito non deve contenere nessuna chiave segreta
      # (stessi prefissi, più la parola service_role). Nessuna variabile d'ambiente segreta in build.
      - name: Build
        run: npm run build

      - name: Chiavi segrete nel sito costruito (dist/)
        run: node scripts/controlla-chiavi.mjs --dist

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    # CI-VELOCE — niente `needs: test`: i due job girano insieme, la corsa dura quanto il piu' lento (~2 min) e non la somma.
    # Il blocco «CI rossa → niente deploy» non cambia: il cancello di Vercel (vercel-ignored-build-step.sh) aspetta
    # NOMINALMENTE tutti e due i job e un rosso in uno qualunque blocca il deploy.
    timeout-minutes: 8  # DoD locked: suite sotto i 4 min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # CI-VELOCE — solo il browser che serve: `chromium-headless-shell` (e2e usa Chromium headless, un solo progetto).
      # La cache salva i binari; la chiave include la versione di Playwright.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Con la cache e' un no-op; senza, scarica solo il headless shell. Un limite di tempo: un download appeso
      # non deve consumare il budget del job (il 22/10 questo passo, con `--with-deps`, ha impiegato 8 min 24 s).
      - name: Install Playwright chromium (solo headless shell)
        timeout-minutes: 4
        run: npx playwright install --only-shell chromium

      # `--with-deps` faceva `apt-get update` + install a ogni corsa, anche con la cache: e' la parte che si e' appesa.
      # Ora le librerie di sistema si installano solo se mancano davvero (ldd sul binario).
      - name: Dipendenze di sistema di Chromium (solo se mancano)
        timeout-minutes: 4
        run: |
          BIN=$(find ~/.cache/ms-playwright -type f \( -name headless_shell -o -name chrome \) | head -1)
          echo "binario: $BIN"
          if [ -n "$BIN" ] && ! ldd "$BIN" | grep -q "not found"; then
            echo "Librerie di sistema gia' presenti: niente apt."
          else
            echo "Mancano librerie: le installo."
            npx playwright install-deps chromium
          fi

      # test:e2e = build:e2e (mode e2e → .env.e2e) && playwright test
      # Il playwright.config.ts avvia npm run preview come webServer.
      - name: Run E2E smoke tests
        run: npm run test:e2e

      # Se il test fallisce, i trace/screenshot sono utili per capire.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
